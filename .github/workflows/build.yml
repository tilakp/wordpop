name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    # macOS 26 for its Xcode 26 SDK: with an older SDK the Apple
    # Intelligence features (Foundation Models) are compiled out.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Test
        run: swift test

      - name: Build app bundle
        run: ./build_app.sh

      - name: Check the Apple Intelligence features are built in
        run: |
          xcodebuild -version
          otool -L WordPop.app/Contents/MacOS/WordPop | grep -q FoundationModels

      - name: Package
        run: ditto -c -k --keepParent WordPop.app WordPop.zip

      - uses: actions/upload-artifact@v4
        with:
          name: WordPop
          path: WordPop.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" WordPop.zip --title "WordPop ${GITHUB_REF_NAME}" --generate-notes
